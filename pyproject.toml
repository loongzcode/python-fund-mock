[project]
name = "python-fund-mock"
version = "1.0.0"
description = "多资金方信贷接口 Mock 服务的纯 Python 实现"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic==1.16.5",
    "fastapi==0.116.1",
    "httpx==0.28.1",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "pymysql==1.1.1",
    "python-multipart==0.0.20",
    "sqlalchemy==2.0.43",
    "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.4.1",
]

[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --basetemp=.pytest-tmp"
